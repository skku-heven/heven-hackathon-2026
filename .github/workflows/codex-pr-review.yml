name: codex PR review

# self-hosted runner에서 Codex가 PR을 리뷰해 코멘트 1개를 남긴다(참고용).
# 저장소 변수 ENABLE_CODEX_REVIEW=true이고 runner의 Codex CLI가 인증되어 있어야 한다. 기본 OFF.
# 스크립트는 항상 기본 브랜치에서 실행하고, PR 코드는 분석 대상으로만 읽는다.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ vars.ENABLE_CODEX_REVIEW == 'true' && !github.event.pull_request.draft }}
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Run Codex review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_CHECKOUT="$GITHUB_WORKSPACE/pr" trusted/ops/runner/bin/codex-pr-review.sh "$PR_NUMBER"
