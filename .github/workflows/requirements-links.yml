name: Requirements links

# Metadata only: execute trusted base-branch tools, never PR code with write access.
on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: requirements-links
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: uv run --python 3.11 --no-project python tools/requirements.py sync --apply
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-links
          path: build/requirements-report.json
          if-no-files-found: ignore
