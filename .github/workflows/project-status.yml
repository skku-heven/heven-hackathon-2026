name: project status (PR lifecycle)

# PR이 닫는(Resolves #N) 이슈의 Project Status를 PR 상태에 맞춘다.
# draft=In progress, Ready=In review, merge 없이 닫힘=Ready.
# GitHub Project built-in workflow가 지원하지 않는 전환을 이 workflow가 맡는다.
#
# 필요 항목: self-hosted runner, repo secret PROJECT_PAT(project + repo).
# 항상 기본 브랜치의 스크립트를 실행하므로 머신에 따로 배포하지 않는다.

on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]

concurrency:
  group: project-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile-status:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile linked issue Status with PR state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "ERROR: PROJECT_PAT secret 미설정 -> Project Status 동기화 실패"
            exit 1
          fi
          ops/runner/bin/pr-set-in-review.sh "$PR_NUMBER"
